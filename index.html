<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zocus AI</title>
<meta name="description" content="Zocus AI: offline sales analytics made easy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=EB+Garamond:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash" role="status" aria-label="Zocus AI">
  <div class="sp-glow" aria-hidden="true"></div>
  <div class="sp-inner">
    <h1 class="sp-title">Zocus AI.</h1>
    <p class="sp-tag">Offline Sales Analytics made easy</p>
  </div>
  <span class="sp-hint" id="spHint">Loading</span>
</div>
<canvas id="waves" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="shell">
  <header class="top">
    <div class="logo"><i></i><span>zocus</span></div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="grow"></div>
    <select class="rsel store" id="storeSel" aria-label="Store" data-tour="store" hidden></select>
    <div class="seg" role="group" aria-label="Time range" data-tour="period">
      <button data-act="period" data-v="today" aria-pressed="false">Today</button>
      <button data-act="period" data-v="yesterday" aria-pressed="false">Yesterday</button>
      <button data-act="period" data-v="7" aria-pressed="false">7 days</button>
      <button data-act="period" data-v="30" aria-pressed="true">30 days</button>
      <button data-act="period" data-v="all" aria-pressed="false">All</button>
    </div>
    <select class="rsel" id="rangeSel" data-rangesel data-tour="period" aria-label="Time range"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">7 days</option><option value="30">30 days</option><option value="all">All</option></select>
    <button class="icb" data-act="palopen" data-tour="search" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Search</span><kbd>/</kbd></button>
    <button class="icb round" data-act="tour" aria-label="Show me around" title="Show me around" data-tour="help"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 3.9"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
    <button class="icb round" data-zact="menu" data-tour="data" aria-haspopup="menu" aria-expanded="false" aria-label="Data: upload or export CSV" title="Data: upload or export CSV"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></button>
    <div class="dmenu" id="dataMenu" role="menu" hidden></div>
  </header>
  <main class="page" id="page"><div class="skel" aria-hidden="true"><i class="sk" style="height:34px;width:min(420px,70%)"></i><i class="sk" style="height:76px"></i><div class="skr"><i class="sk"></i><i class="sk"></i><i class="sk"></i></div><i class="sk" style="height:220px"></i></div></main>
</div>
<nav class="bnav" id="bnav" aria-label="Main navigation"></nav>
<div id="palRoot"></div>
<div id="drawerRoot"></div>
<div id="tourRoot"></div>
<div id="toastRoot"></div>
<div id="modalRoot"></div>
<input type="file" id="zfile" accept=".csv,text/csv" hidden>
<div class="drophint" id="dropHint" hidden>Drop a CSV to load it</div>

<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/motion.js"></script>
<script src="js/coaching.js"></script>
<script src="js/splash.js"></script>
<script>
ZocusData.load().then(function(ds){
  if(ds&&ds.empty){ZSplash.ready();return}
  var s=document.createElement('script');s.src='js/app.js';
  s.onload=function(){ZSplash.ready()};s.onerror=function(){ZSplash.ready()};
  document.body.appendChild(s);
}).catch(function(e){console.error(e);ZSplash.ready()});
</script>
</body>
</html>
